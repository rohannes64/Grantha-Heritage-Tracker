# Publish: after CI passes on main, build the app image, scan it, and push it to GitHub Container Registry.
#   Tags: the full commit SHA (what was tested) and `latest`.
#   Gate: Trivy fails the run on any CRITICAL vulnerability that has a fix available, before anything is pushed.
name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/grantha

jobs:
  publish:
    # From CI: only when it passed for a push (not a pull request). By hand: always.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Commit being published
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          tags: grantha:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      - name: Vulnerability gate (Trivy)
        # Pinned by commit: this action's tags were renamed (0.28.0 -> v0.28.0) in 2026, which broke the old pin.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: grantha:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.rev.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      - name: Summary
        run: |
          {
            echo "### Published"
            echo "\`${IMAGE}:${{ steps.rev.outputs.sha }}\`"
            echo
            echo "Run it: \`docker run -p 8000:8000 --env-file .env ${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
