# Deploy: after the image is published from main, ship the same commit to the GCE VM with scripts/deploy_vm.sh
# (git archive of HEAD -> per-file backup on the VM -> systemctl restart grantha-app -> smoke test of every API route).
#
# Runs in the `production` environment: add a required reviewer there (Settings -> Environments) so each deploy waits
# for a click. Each run is recorded as a GitHub deployment, which scripts/dora_metrics.py reads.
#
# Google Cloud sign-in uses Workload Identity Federation (no stored key). One-time setup: scripts/setup_github_deploy.sh,
# then set the repository variables it prints. Until GCP_WIF_PROVIDER is set, this workflow skips itself.
name: Deploy

on:
  workflow_run:
    workflows: [Publish image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only smoke-test the live app (no deploy)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write       # to ask GitHub for the OIDC token that Google exchanges
  deployments: read     # for the DORA summary

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cut a deploy off half-way

jobs:
  deploy:
    if: >-
      vars.GCP_WIF_PROVIDER != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://grantha.tail7ee38f.ts.net/
    env:
      GRANTHA_PROJECT: ${{ vars.GCP_PROJECT }}
      GRANTHA_ZONE: ${{ vars.GCP_ZONE }}
      GRANTHA_VM: ${{ vars.GCP_VM }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5     # deploy_vm.sh's smoke test calls `python`
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy and smoke-test
        if: ${{ !inputs.check_only }}
        run: bash scripts/deploy_vm.sh

      - name: Smoke-test the live app only
        if: ${{ inputs.check_only }}
        run: bash scripts/deploy_vm.sh --check

  dora:
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: DORA metrics (last 30 days of production deployments)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/dora_metrics.py --repo "${{ github.repository }}" --days 30 >> "$GITHUB_STEP_SUMMARY"
